services:
  api01: &api
    build:
      context: .
    hostname: api01

    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "postgresql://rinha:rinha@postgres:5432/rinha"

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "110MB"

  api02:
    <<: *api
    hostname: api02

  postgres:
    image: postgres:17
    hostname: postgres

    environment:
      POSTGRES_DB: rinha
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha

    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha -d rinha"]
      interval: 2s
      timeout: 2s
      retries: 15

    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: "310MB"

  nginx:
    image: nginx:alpine
    hostname: nginx

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "9999:9999"

    depends_on:
      - api01
      - api02

    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

networks:
  default:
    driver: bridge