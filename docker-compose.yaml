services:
  api01: &api
    build:
      context: .
    network_mode: host
    hostname: api01

    environment:
      HTTP_PORT: 8081
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "postgresql://rinha:rinha@localhost:5432/rinha"

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "110MB"

  api02:
    <<: *api
    hostname: api02
    environment:
      HTTP_PORT: 8082
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "postgresql://rinha:rinha@localhost:5432/rinha"


  postgres:
    image: postgres:17
    network_mode: host
    hostname: postgres
    environment:
      POSTGRES_DB: rinha
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha

    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha -d rinha"]
      interval: 2s
      timeout: 2s
      retries: 15

    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: "310MB"

  nginx:
    image: nginx:alpine
    hostname: nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api01
      - api02

    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"
