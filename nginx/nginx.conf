events {
    worker_connections 1024; # por que 1024? https://www.nginx.com/resources/wiki/start/topics/tutorials/config_pitfalls/#worker_connections
}

http {
    access_log off;
    
    upstream api {
        server api01:8080;
        server api02:8080;
    }

    server {
        listen 9999;
        
        location / {
            proxy_pass http://api;
        }
    }
}
